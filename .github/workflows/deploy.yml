name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    # Hourly: unfinished rounds every run, everything once the last full refresh is 6+ hours old
    # (scripts/fetch-data.mjs decides). GitHub may start scheduled runs late or skip some.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a newer run replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          # The live site: the script reuses its finished rounds and club details.
          PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir _site
          cp index.html icon.png _site/
          node scripts/fetch-data.mjs _site/data
          # Old name of the Israeli data file, for browsers still holding the previous page.
          cp _site/data/il.json _site/fixtures.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
